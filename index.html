<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#075844" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- 아이폰 사파리 '홈 화면에 추가' 했을 때의 아이콘 이름 (전체 제목은 아이콘 아래에서 잘립니다) -->
    <meta name="apple-mobile-web-app-title" content="마작 고수" />
    <meta name="description" content="친구 모임용 리치마작 대국 기록" />
    <title>마작 고수들의 모임</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- 아이폰 홈 화면 아이콘 (180×180, 투명 없이 — iOS 가 모서리를 둥글게 깎습니다) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 홈 로고의 發 한 글자용 명조체. text= 로 글자 하나만 받아서 몇 KB 수준이며, 폰에서도 노트북과 같은 서체로 보입니다. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@900&text=%E7%99%BC&display=swap" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
